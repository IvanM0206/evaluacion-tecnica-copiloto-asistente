[pytest]
DJANGO_SETTINGS_MODULE = config.settings
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers
xfail_strict = true
filterwarnings =
    ignore::DeprecationWarning:ninja.*
    # whitenoise avisa si no existe STATIC_ROOT (sin collectstatic); no afecta a los tests
    ignore:No directory at:UserWarning
